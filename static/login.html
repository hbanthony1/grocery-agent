<!DOCTYPE html>
<html lang="en" id="loginHtml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FF6B35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grocery">
<title>Grocery Agent</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<style>
  :root {
    --bg:        #ffffff;
    --surface:   #f5f5f5;
    --border:    #e0e0e0;
    --text:      #1a1a1a;
    --muted:     #6b6b6b;
    --accent:    #FF6B35;
    --accent-dk: #e05520;
    --radius:    10px;
    --input-h:   44px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:      #121212;
      --surface: #1e1e1e;
      --border:  #333;
      --text:    #f0f0f0;
      --muted:   #999;
    }
  }
  html[data-theme="dark"]  { --bg:#121212; --surface:#1e1e1e; --border:#333; --text:#f0f0f0; --muted:#999; }
  html[data-theme="light"] { --bg:#ffffff; --surface:#f5f5f5; --border:#e0e0e0; --text:#1a1a1a; --muted:#6b6b6b; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 28px;
    width: 100%;
    max-width: 380px;
  }

  .logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
    color: var(--text);
  }
  .logo em { color: var(--accent); font-style: normal; }
  .tagline {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 28px;
  }

  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
    gap: 0;
  }
  .tab {
    flex: 1;
    background: none;
    border: none;
    padding: 10px 0;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    margin-bottom: -1px;
  }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .form { display: flex; flex-direction: column; gap: 14px; }
  .form.hidden { display: none; }

  label {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    display: block;
    margin-bottom: 5px;
  }
  input[type="text"],
  input[type="password"] {
    width: 100%;
    height: var(--input-h);
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); }

  .btn-primary {
    height: var(--input-h);
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 4px;
  }
  .btn-primary:hover { background: var(--accent-dk); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .error {
    font-size: 13px;
    color: #e53935;
    background: #fce4e4;
    border-radius: 6px;
    padding: 8px 12px;
    display: none;
  }
  .error.show { display: block; }

  .hint {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 6px;
  }

  .theme-btn {
    position: fixed;
    top: 14px;
    right: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
</style>
</head>
<body>

<button class="theme-btn" onclick="cycleTheme()" id="themeBtn">auto</button>

<div class="card">
  <div class="logo">Grocery <em>Agent</em></div>
  <div class="tagline">Weekly meal planner</div>

  <div class="tabs">
    <button class="tab active" id="tabLogin" onclick="showTab('login')">Sign in</button>
    <button class="tab" id="tabRegister" onclick="showTab('register')">Create account</button>
  </div>

  <!-- LOGIN FORM -->
  <form class="form" id="formLogin" onsubmit="doLogin(event)">
    <div>
      <label for="loginUser">Username</label>
      <input id="loginUser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div>
      <label for="loginPass">Password</label>
      <input id="loginPass" type="password" autocomplete="current-password" required>
    </div>
    <div class="error" id="loginErr"></div>
    <button class="btn-primary" type="submit" id="loginBtn">Sign in</button>
  </form>

  <!-- REGISTER FORM -->
  <form class="form hidden" id="formRegister" onsubmit="doRegister(event)">
    <div>
      <label for="regUser">Username</label>
      <input id="regUser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"
             pattern="[a-z0-9_-]{2,}" title="2+ lowercase letters, numbers, _ or -" required>
    </div>
    <div>
      <label for="regPass">Password</label>
      <input id="regPass" type="password" autocomplete="new-password" minlength="6" required>
    </div>
    <div id="inviteWrap">
      <label for="regInvite">Invite code</label>
      <input id="regInvite" type="text" autocapitalize="none" spellcheck="false" placeholder="Required for new accounts">
    </div>
    <div class="error" id="regErr"></div>
    <button class="btn-primary" type="submit" id="regBtn">Create account</button>
    <p class="hint" id="firstRunHint" style="display:none">No accounts exist yet — no invite code needed.</p>
  </form>
</div>

<script>
  // ── Theme ──────────────────────────────────────────────────────────────────
  const THEME_CYCLE = ['auto', 'dark', 'light'];
  function _applyTheme(t) {
    const html = document.getElementById('loginHtml');
    if (t === 'auto') html.removeAttribute('data-theme');
    else html.setAttribute('data-theme', t);
    document.getElementById('themeBtn').textContent = t;
  }
  function cycleTheme() {
    const cur  = localStorage.getItem('grocery_theme') || 'auto';
    const next = THEME_CYCLE[(THEME_CYCLE.indexOf(cur) + 1) % THEME_CYCLE.length];
    localStorage.setItem('grocery_theme', next);
    _applyTheme(next);
  }
  _applyTheme(localStorage.getItem('grocery_theme') || 'auto');

  // ── Tab switch ─────────────────────────────────────────────────────────────
  function showTab(tab) {
    document.getElementById('formLogin').classList.toggle('hidden', tab !== 'login');
    document.getElementById('formRegister').classList.toggle('hidden', tab !== 'register');
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
    document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
  }

  // Check if this is first run (no users) — hide invite field if so
  fetch('/auth/me').catch(() => {});
  fetch('/register', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({username:'__probe__', password:'__probe__', invite:''}) })
    .then(r => r.json())
    .then(d => {
      if (d.error && d.error.includes('invite code')) {
        // invite required — show field (default)
      } else if (d.error && !d.error.includes('invite')) {
        // first run — no invite needed
        document.getElementById('inviteWrap').style.display = 'none';
        document.getElementById('firstRunHint').style.display = 'block';
      }
    }).catch(() => {});

  // ── Login ──────────────────────────────────────────────────────────────────
  async function doLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginErr');
    err.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
      const r = await fetch('/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: document.getElementById('loginUser').value.trim(),
          password: document.getElementById('loginPass').value,
        }),
      });
      const d = await r.json();
      if (d.ok) {
        window.location.href = '/';
      } else {
        err.textContent = d.error || 'Login failed';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    } catch {
      err.textContent = 'Network error — is the server running?';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  }

  // ── Register ───────────────────────────────────────────────────────────────
  async function doRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('regBtn');
    const err = document.getElementById('regErr');
    err.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Creating…';
    try {
      const r = await fetch('/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: document.getElementById('regUser').value.trim(),
          password: document.getElementById('regPass').value,
          invite:   document.getElementById('regInvite').value.trim(),
        }),
      });
      const d = await r.json();
      if (d.ok) {
        window.location.href = '/';
      } else {
        err.textContent = d.error || 'Registration failed';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    } catch {
      err.textContent = 'Network error — is the server running?';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Create account';
    }
  }
</script>
</body>
</html>
